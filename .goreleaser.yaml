version: 2

builds:
  - id: wafguard
    main: ./cmd/wafguard
    binary: wafguard
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
  - id: wafctl
    main: ./cmd/wafctl
    binary: wafctl
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - id: wafguard
    ids: [wafguard]
    name_template: 'wafguard_{{ .Os }}_{{ .Arch }}'
  - id: wafctl
    ids: [wafctl]
    name_template: 'wafctl_{{ .Os }}_{{ .Arch }}'

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'

# The repository was renamed; inference from the git remote still yields the
# old path, which breaks asset uploads (307 from uploads.github.com).
release:
  github:
    owner: ba0f3
    name: wafguard

dockers:
  - ids: [wafguard]
    dockerfile: deploy/Dockerfile.goreleaser
    image_templates:
      - 'ghcr.io/ba0f3/haproxy-waf-spoe:{{ .Version }}'
      - 'ghcr.io/ba0f3/haproxy-waf-spoe:latest'
    goos: linux
    goarch: amd64
    build_flag_templates:
      - '--label=org.opencontainers.image.source=https://github.com/ba0f3/wafguard'
      - '--label=org.opencontainers.image.version={{ .Version }}'
      - '--label=org.opencontainers.image.revision={{ .FullCommit }}'
