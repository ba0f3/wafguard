[wafguard]
spoe-agent wafguard-agent
    groups      check-ban waf-verdict observe-response
    option      var-prefix      wafguard
    option      set-on-error    error
    option      continue-on-error
    timeout     hello           2s
    timeout     idle            2m
    timeout     processing      500ms
    max-frame-size 16380
    use-backend wafguard-spoa
    log         global

spoe-message check-ban
    args app=var(txn.wafguard.app) request_id=var(txn.wafguard.request_id) schema_version=str(1) client_ip=var(txn.wafguard.client_ip) peer_ip=src method=method path=path

spoe-message waf-verdict
    args app=var(txn.wafguard.app) request_id=var(txn.wafguard.request_id) schema_version=str(1) admission_generation=var(txn.wafguard.admission_generation) admission_at_ms=var(txn.wafguard.admission_at_ms) policy_revision=var(txn.wafguard.policy_revision) behavior_mode=var(txn.wafguard.behavior_mode) request_waf_action=var(txn.wafguard.snap_action) request_waf_source=var(txn.wafguard.snap_source) request_waf_inspection_error=var(txn.wafguard.snap_insp_err) path=path method=method client_ip=var(txn.wafguard.client_ip) peer_ip=src

spoe-message observe-response
    args app=var(txn.wafguard.app) request_id=var(txn.wafguard.request_id) schema_version=str(1) admission_generation=var(txn.wafguard.admission_generation) admission_at_ms=var(txn.wafguard.admission_at_ms) behavior_mode=var(txn.wafguard.behavior_mode) origin_status=var(txn.wafguard.origin_status) request_waf_action=var(txn.wafguard.req_snap_action) request_waf_source=var(txn.wafguard.req_snap_source) client_ip=var(txn.wafguard.client_ip)

spoe-group check-ban
    messages check-ban

spoe-group waf-verdict
    messages waf-verdict

spoe-group observe-response
    messages observe-response

