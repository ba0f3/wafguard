global
    log stdout format raw local0

defaults
    log global
    option httplog
    log-format "%ci %ST %[var(txn.coraza.action)] %[var(txn.coraza.status)] %[var(txn.coraza.ruleid)] %r"
    timeout client 1m
    timeout server 1m
    timeout connect 10s

frontend http_in
    mode http
    bind *:8080

    http-request set-var(txn.wafguard.request_id) uuid(4)
    http-request set-var(txn.coraza.app) str(sample_app)
    http-request set-var(txn.wafguard.app) str(sample_app)
    http-request set-var(txn.wafguard.client_ip) src
    http-request set-var(txn.wafguard.action) str(unknown)

    filter spoe engine wafguard config /usr/local/etc/haproxy/wafguard.cfg
    filter spoe engine coraza config /usr/local/etc/haproxy/coraza.cfg

    http-request send-spoe-group wafguard check-ban
    http-request send-spoe-group coraza coraza-req
    http-request set-var(txn.wafguard.snap_action) var(txn.coraza.action)
    http-request set-var(txn.wafguard.snap_source) str(enforced) if { var(txn.coraza.action) -m str deny } || { var(txn.coraza.action) -m str drop }
    http-request set-var(txn.wafguard.snap_source) str(hypothetical) if { var(txn.coraza.action) -m str pass }
    http-request send-spoe-group wafguard waf-verdict

    http-request deny deny_status 403 hdr waf-block "request" if { var(txn.coraza.action) -m str deny }

    default_backend origin

backend origin
    mode http
    server s1 testorigin:8081

backend recorder-spoa
    mode tcp
    option spop-check
    server r1 recorder:12346 check

backend coraza-spoa
    mode tcp
    option spop-check
    server c1 coraza-spoa:9000 check
