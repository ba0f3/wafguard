bind: 0.0.0.0:9000
log_level: info
log_file: /dev/stdout
log_format: console
default_application: sample_app
applications:
  - name: sample_app
    log_level: info
    log_file: /dev/stdout
    log_format: console
    # Response inspection: set SecResponseBodyMimeType to the MIME types your origin
    # actually returns (Coraza buffers only those types). Coverage is bounded by the
    # HAProxy response buffer and the 500 ms wait, never the whole response.
    directives: |
      SecRuleEngine On
      SecRequestBodyAccess On
      SecRule REQUEST_BODY "@contains body-marker-fixture" "id:1005,phase:2,deny,status:403"
      SecRule REQUEST_HEADERS:User-Agent "@contains fixture-deny-request" "id:1001,phase:1,deny,status:403"
      SecRule REQUEST_URI "@contains /marker-deny" "id:1002,phase:1,deny,status:403"
      SecRule REQUEST_URI "@streq /marker-redirect" "id:1003,phase:1,redirect:'http://testorigin:8081/ok',status:302"
      SecRule REQUEST_URI "@streq /marker-drop" "id:1004,phase:1,drop"
      SecResponseBodyAccess On
      SecResponseBodyMimeType application/json text/plain text/html
      SecResponseBodyLimit 131072
    response_check: true
    transaction_ttl_ms: 60000
