global
    log stdout format raw local0

defaults
    log global
    option httplog
    log-format "%ci %ST %[var(txn.coraza.action)] %[var(txn.coraza.status)] %[var(txn.coraza.ruleid)] %r"
    timeout client 1m
    timeout server 1m
    timeout connect 10s

frontend http_in
    mode http
    bind *:8080
    bind *:8443 alpn h2,http/1.1

    http-request set-var(txn.wafguard.request_id) uuid(4)
    http-request set-var(txn.coraza.app) str(sample_app)
    http-request set-var(txn.wafguard.app) str(sample_app)
    http-request set-var(txn.wafguard.client_ip) src
    http-request set-var(txn.wafguard.res_insp) str(1) if { path -m str /marker-response-body } || { path -m str /marker-resp-body-benign } || { path -m str /marker-resp-body-evil } || { path -m str /phase4-body-control } || { path -m str /phase4-body-marker }

    filter spoe engine wafguard config /usr/local/etc/haproxy/wafguard.cfg
    filter spoe engine coraza config /usr/local/etc/haproxy/coraza.cfg

    http-request send-spoe-group wafguard check-ban
    http-request deny deny_status 403 if { var(txn.wafguard.action) -m str ban }
    http-request deny deny_status 429 if { var(txn.wafguard.action) -m str throttle }

    http-request send-spoe-group coraza coraza-req
    http-request set-var(txn.wafguard.snap_action) var(txn.coraza.action)
    http-request set-var(txn.wafguard.snap_source) str(hypothetical) if !{ var(txn.wafguard.behavior_mode) -m str enforce }
    http-request set-var(txn.wafguard.snap_source) str(enforced) if { var(txn.wafguard.behavior_mode) -m str enforce } { var(txn.coraza.action) -m str deny } || { var(txn.coraza.action) -m str drop }
    http-request set-var(txn.wafguard.snap_insp_err) str(1) if { var(txn.coraza.error) -m int gt 0 }
    http-request set-var(txn.wafguard.req_snap_action) var(txn.wafguard.snap_action)
    http-request set-var(txn.wafguard.req_snap_source) var(txn.wafguard.snap_source)
    http-request send-spoe-group wafguard waf-verdict

    http-request redirect code 302 location %[var(txn.coraza.data)] if { var(txn.coraza.action) -m str redirect }
    http-request deny deny_status 403 hdr waf-block "request" if { var(txn.coraza.action) -m str deny }
    http-request silent-drop if { var(txn.coraza.action) -m str drop }
    http-request deny deny_status 500 if { var(txn.coraza.error) -m int gt 0 }

    default_backend origin

    http-response set-var(txn.wafguard.origin_status) status
    http-response send-spoe-group coraza coraza-response-sync if { var(txn.wafguard.res_insp) -m str 1 }
    http-response deny deny_status 403 hdr waf-block "response" if { var(txn.wafguard.res_insp) -m str 1 } { var(txn.coraza.action) -m str deny }
    http-response send-spoe-group wafguard observe-response

# Upstream (operator-supplied): replace server line with your origin hostname/IP.
# Lab stand-in uses compose service testorigin:8081; production example:
#   server s1 YOUR_ORIGIN_HOST:443 ssl verify required ca-file /etc/ssl/certs/ca.pem
backend origin
    mode http
    server s1 testorigin:8081 check

backend wafguard-spoa
    mode tcp
    option spop-check
    server w1 wafguard:12345 check

backend coraza-spoa
    mode tcp
    option spop-check
    server c1 coraza-spoa:9000 check
