global
    log stdout format raw local0

defaults
    log global
    option httplog
    log-format "%ci %ST %[var(txn.coraza.action)] %[var(txn.coraza.status)] %[var(txn.coraza.ruleid)] %r"
    timeout client 1m
    timeout server 1m
    timeout connect 10s

frontend http_in
    mode http
    bind *:8080
    bind *:8443 alpn h2,http/1.1

    # Keep request- and response-phase Coraza SPOE groups on the same agent.
    stick-table type string len 64 size 100k expire 2m
    http-request set-var(txn.wafguard.request_id) uuid(4)
    http-request track-sc0 var(txn.wafguard.request_id) table http_in
    # Deliver the proxy-generated id to the login origin so its auth outcome
    # can only be correlated with this admission (client values are replaced).
    http-request set-header X-Wafguard-Request-Id %[var(txn.wafguard.request_id)]
    http-request set-var(txn.coraza.app) str(sample_app)
    http-request set-var(txn.wafguard.app) str(sample_app)
    http-request set-var(txn.wafguard.client_ip) src
    # Inspection flags (req_insp / res_insp / observe_response) come from the
    # check-ban ACK, backed by per-app path lists in Redis.
    # Request-body inspection is opt-in: wait a bounded time for the body
    # before Coraza sees it, but never stall the request indefinitely.

    filter spoe engine wafguard config /usr/local/etc/haproxy/wafguard.cfg
    filter spoe engine coraza config /usr/local/etc/haproxy/coraza.cfg

    http-request send-spoe-group wafguard check-ban
    http-request deny deny_status 403 if { var(txn.wafguard.action) -m str ban }
    http-request deny deny_status 429 if { var(txn.wafguard.action) -m str throttle }

    http-request wait-for-body time 500 if { var(txn.wafguard.req_insp) -m str 1 }
    http-request send-spoe-group coraza coraza-req
    http-request set-var(txn.wafguard.snap_action) var(txn.coraza.action)
    http-request set-var(txn.wafguard.snap_source) str(hypothetical) if !{ var(txn.wafguard.behavior_mode) -m str enforce }
    http-request set-var(txn.wafguard.snap_source) str(enforced) if { var(txn.wafguard.behavior_mode) -m str enforce } { var(txn.coraza.action) -m str deny } || { var(txn.coraza.action) -m str drop }
    http-request set-var(txn.wafguard.snap_insp_err) str(1) if { var(txn.coraza.error) -m int gt 0 }
    http-request set-var(txn.wafguard.req_snap_action) var(txn.wafguard.snap_action)
    http-request set-var(txn.wafguard.req_snap_source) var(txn.wafguard.snap_source)
    http-request send-spoe-group wafguard waf-verdict

    http-request redirect code 302 location %[var(txn.coraza.data)] if { var(txn.coraza.action) -m str redirect }
    http-request deny deny_status 403 hdr waf-block "request" if { var(txn.coraza.action) -m str deny }
    http-request silent-drop if { var(txn.coraza.action) -m str drop }
    http-request deny deny_status 500 if { var(txn.coraza.error) -m int gt 0 }

    default_backend origin

    http-response set-var(txn.wafguard.origin_status) status
    # Clear verdicts left by the request phase so a response-phase transport
    # error or missing transaction cannot be mistaken for a clean verdict.
    http-response set-var(txn.coraza.action) str()
    http-response unset-var(txn.coraza.status)
    http-response set-var(txn.coraza.ruleid) str()
    http-response set-var(txn.coraza.error) int(0)
    # res.body only holds bytes buffered at rule time; wait up to 500 ms before sending it to Coraza.
    http-response wait-for-body time 500 if { var(txn.wafguard.res_insp) -m str 1 }
    http-response send-spoe-group coraza coraza-response-sync if { var(txn.wafguard.res_insp) -m str 1 }
    # Stock coraza-spoa reports an uncorrelated response as txn.coraza.error
    # >= 1000; a successful ACK sets no error var. Use that upstream signal.
    http-response deny deny_status 500 hdr waf-block "response-error" if { var(txn.wafguard.res_insp) -m str 1 } { var(txn.coraza.error) -m int gt 0 }
    http-response deny deny_status 403 hdr waf-block "response" if { var(txn.wafguard.res_insp) -m str 1 } { var(txn.coraza.action) -m str deny }
    # Response observation is opt-in; a status signal alone must never be
    # re-counted as a second WAF verdict for the same request.
    http-response send-spoe-group wafguard observe-response if { var(txn.wafguard.observe_response) -m str 1 }

# Upstream (operator-supplied): replace server line with your origin hostname/IP.
# Lab stand-in uses compose service testorigin:8081; production example:
#   server s1 YOUR_ORIGIN_HOST:443 ssl verify required ca-file /etc/ssl/certs/ca.pem
backend origin
    mode http
    server s1 testorigin:8081 check

backend wafguard-spoa
    mode tcp
    option spop-check
    balance hash var(txn.wafguard.request_id)
    stick match var(txn.wafguard.request_id) table http_in
    server w1 172.31.10.10:12345 check
    server w2 172.31.10.11:12345 check

backend coraza-spoa
    mode tcp
    option spop-check
    # Coraza caches the request transaction in-process for phase-4 response
    # inspection, so the replica must be a hot standby rather than an active
    # peer: request- and response-phase SPOE groups must reach the same agent.
    server c1 172.31.10.20:9000 check
    server c2 172.31.10.21:9000 check backup
