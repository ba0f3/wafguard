services:
  wafguard:
    volumes:
      - ../deploy/wafguard.enforce.json:/etc/wafguard/config.json:ro
    ports:
      - "127.0.0.1:19200:19200"
  wafguard2:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ../deploy/wafguard2.example.json:/etc/wafguard/config.json:ro
    environment:
      - WG_CONFIG=/etc/wafguard/config.json
    expose:
      - "12346"

  haproxy-b:
    image: haproxy:3.2.0
    depends_on: [wafguard2, coraza-spoa, testorigin, redis]
    volumes:
      - ../deploy/haproxy/haproxy-b.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
      - ../deploy/haproxy/coraza.cfg:/usr/local/etc/haproxy/coraza.cfg:ro
      - ../deploy/haproxy/wafguard.cfg:/usr/local/etc/haproxy/wafguard.cfg:ro
    ports:
      - "127.0.0.1:18081:8080"
