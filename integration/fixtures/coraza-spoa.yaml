bind: 0.0.0.0:9000
log_level: info
log_file: /dev/stdout
log_format: console
default_application: sample_app
applications:
  - name: sample_app
    log_level: info
    log_file: /dev/stdout
    log_format: console
    directives: |
      SecRuleEngine On
      SecRule REQUEST_HEADERS:User-Agent "@contains fixture-deny-request" "id:1001,phase:1,deny,status:403"
      SecRule REQUEST_URI "@contains /marker-deny" "id:1002,phase:1,deny,status:403"
      SecRule REQUEST_URI "@streq /marker-redirect" "id:1003,phase:1,redirect:'http://testorigin:8081/ok',status:302"
      SecRule REQUEST_URI "@streq /marker-drop" "id:1004,phase:1,drop"
    response_check: false
    transaction_ttl_ms: 60000

