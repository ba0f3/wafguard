services:
  redis-replica:
    image: redis:7-alpine
    command: ["redis-server", "--replicaof", "redis", "6379", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6380:6379"
    depends_on:
      redis:
        condition: service_healthy

  redis-sentinel:
    image: redis:7-alpine
    depends_on:
      redis:
        condition: service_healthy
      redis-replica:
        condition: service_started
    ports:
      - "127.0.0.1:26379:26379"
    command:
      - sh
      - -c
      - |
        printf 'port 26379\nsentinel monitor mymaster redis 6379 1\nsentinel resolve-hostnames yes\nsentinel down-after-milliseconds mymaster 3000\n' > /tmp/sentinel.conf
        exec redis-sentinel /tmp/sentinel.conf

  wafguard:
    volumes:
      - ../deploy/wafguard.sentinel.json:/etc/wafguard/config.json:ro
    depends_on:
      redis:
        condition: service_healthy
      redis-sentinel:
        condition: service_started
    environment:
      - WG_CONFIG=/etc/wafguard/config.json
